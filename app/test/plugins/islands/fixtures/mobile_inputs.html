<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px system-ui}.row{display:flex;gap:8px;margin:12px}.row label{width:120px}.row input,.row textarea,.row select{min-width:0;padding:8px;flex:1}button{padding:12px}
</style></head><body>
<div class="row"><label for="text">Text</label><input id="text"></div>
<div class="row"><label for="password">Password</label><input id="password" type="password"></div>
<div class="row"><label for="email">Email</label><input id="email" type="email"></div>
<div class="row"><label for="url">URL</label><input id="url" type="url"></div>
<div class="row"><label for="tel">Telephone</label><input id="tel" type="tel"></div>
<div class="row"><label for="search">Search</label><input id="search" type="search"></div>
<div class="row"><label for="number">Number</label><input id="number" type="number"></div>
<div class="row"><label for="textarea">Notes</label><textarea id="textarea"></textarea></div>
<div class="row"><label for="select">Choice</label><select id="select"><option>One</option><option>Two</option></select></div>
<div class="row"><label for="date">Date</label><input id="date" type="date"></div>
<div class="row"><label for="time">Time</label><input id="time" type="time"></div>
<div class="row"><label for="color">Color</label><input id="color" type="color"></div>
<div class="row"><label for="file">File</label><input id="file" type="file"></div>
<div class="row"><label for="checkbox">Enabled</label><input id="checkbox" type="checkbox"></div>
<div class="row"><label for="radio">Mode</label><input id="radio" type="radio"></div>
<div class="row"><label for="range">Volume</label><input id="range" type="range"></div>
<div role="toolbar"><button id="save" onclick="this.dataset.saved='yes'">Save</button><button>Cancel</button></div>
</body></html>
